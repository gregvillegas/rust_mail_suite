name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Compile sqlx queries from the committed .sqlx/ cache. Tests still need a
  # live database at runtime (they create per-test databases), see below.
  SQLX_OFFLINE: "true"
  DATABASE_URL: postgres://rustmail:rustmail@localhost:5432/rustmail

jobs:
  ci:
    name: fmt · clippy · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rustmail
          POSTGRES_PASSWORD: rustmail
          POSTGRES_DB: rustmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustmail -d rustmail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: MTA templates render
        run: scripts/test-templates.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets
