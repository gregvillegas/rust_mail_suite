<ul class="nav flex-column py-2">
  {% for f in folders %}
  <li class="nav-item">
    {% if f.selectable %}
    <a class="nav-link d-flex justify-content-between align-items-center rm-depth-{{ f.depth }}{% if f.active %} active{% endif %}" href="{{ f.url }}"{% if f.active %} aria-current="page"{% endif %}>
      <span class="text-truncate">{{ f.label }}</span>
      {% if f.unread > 0 %}<span class="badge text-bg-primary rounded-pill">{{ f.unread }}<span class="visually-hidden"> {{ ctx.t("mail-unread") }}</span></span>{% endif %}
    </a>
    {% else %}
    <span class="nav-link disabled rm-depth-{{ f.depth }}">{{ f.label }}</span>
    {% endif %}
  </li>
  {% endfor %}
  <li class="nav-item mt-2 border-top pt-2"><a class="nav-link small" href="{{ folders_url }}">{{ ctx.t("mail-manage-folders") }}</a></li>
</ul>
