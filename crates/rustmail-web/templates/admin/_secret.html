<div class="alert alert-success mb-0" role="status">
  <h2 class="h5">{{ ctx.t(heading_key) }}</h2>
  <p class="mb-2"><strong>{{ email }}</strong></p>
  {% if let Some(password) = password %}
  <p class="mb-1">{{ ctx.t("admin-secret-once") }}</p>
  <p><code class="user-select-all fs-5" data-testid="generated-password">{{ password }}</code></p>
  {% else %}
  <p>{{ ctx.t("admin-secret-chosen") }}</p>
  {% endif %}
  <a class="btn btn-primary btn-sm" href="{{ link }}">{{ ctx.t("admin-secret-continue") }}</a>
</div>
