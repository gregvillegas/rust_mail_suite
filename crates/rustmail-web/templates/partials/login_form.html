<form id="login-form" method="post" action="/login"
      hx-post="/login" hx-target="this" hx-swap="outerHTML" hx-boost="false"
      hx-disabled-elt="find button[type=submit]" novalidate>
  <input type="hidden" name="next" value="{{ form.next }}">

  {% if let Some(message) = form.error -%}
  <div class="alert alert-danger" role="alert" id="login-error">{{ message }}</div>
  {%- endif %}

  <div class="mb-3">
    <label for="login-email" class="form-label">{{ ctx.t("login-email") }}</label>
    <input type="email" class="form-control" id="login-email" name="email" value="{{ form.email }}"
           autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email" required
           {%- if form.error.is_some() %} aria-describedby="login-error" aria-invalid="true"{% endif %}>
  </div>

  <div class="mb-4" x-data="passwordField" data-show-label="{{ ctx.t("login-show-password") }}" data-hide-label="{{ ctx.t("login-hide-password") }}">
    <label for="login-password" class="form-label">{{ ctx.t("login-password") }}</label>
    <div class="input-group">
      <input :type="inputType" class="form-control" id="login-password" name="password"
             type="password" autocomplete="current-password" required
             {%- if form.error.is_some() %} aria-describedby="login-error"{% endif %}>
      <button class="btn btn-outline-secondary" type="button" @click="toggle" :aria-pressed="pressed" :aria-label="toggleLabel" aria-label="{{ ctx.t("login-show-password") }}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.17 8a13 13 0 0 1 1.66-2.04C4.12 4.67 5.88 3.5 8 3.5s3.88 1.17 5.17 2.46A13 13 0 0 1 14.83 8a13 13 0 0 1-1.66 2.04C11.88 11.33 10.12 12.5 8 12.5s-3.88-1.17-5.17-2.46A13 13 0 0 1 1.17 8"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M6.5 8a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0"/></svg>
      </button>
    </div>
  </div>

  <button type="submit" class="btn btn-primary w-100">
    <span class="rm-idle">{{ ctx.t("login-submit") }}</span>
    <span class="rm-busy"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span> {{ ctx.t("login-submitting") }}</span>
  </button>
</form>
