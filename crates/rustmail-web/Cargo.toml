[package]
name = "rustmail-web"
description = "Webmail + public UI + WebSocket server for RustMail Suite (axum + askama)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "rustmail_web"
path = "src/lib.rs"

[[bin]]
name = "rustmail-web"
path = "src/main.rs"

[dependencies]
rustmail-core.workspace = true
rustmail-imap.workspace = true
tokio = { workspace = true, features = ["sync", "time", "process"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
futures-util.workspace = true
dotenvy.workspace = true
axum.workspace = true
axum-extra.workspace = true
tower_governor.workspace = true
time.workspace = true
askama.workspace = true
fluent-templates.workspace = true
tower-http.workspace = true
tower.workspace = true
sha2.workspace = true

[dev-dependencies]
base64.workspace = true
axum-test.workspace = true
sqlx.workspace = true
