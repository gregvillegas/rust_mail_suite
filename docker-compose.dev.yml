# RustMail Suite — development infrastructure.
#
# Brings up the backing services the Rust binaries talk to during local
# development. The Rust services themselves run on the host via `cargo run`.
#
#   make dev   # start this stack (detached)
#   make down  # stop it
#
# Values are sourced from the .env file (copy .env.example -> .env).

name: rustmail-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: rustmail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rustmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rustmail}
      POSTGRES_DB: ${POSTGRES_DB:-rustmail}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rustmail} -d ${POSTGRES_DB:-rustmail}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rustmail-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mailpit — maintained successor to MailHog. Dev SMTP sink + web UI.
  mailpit:
    image: axllent/mailpit:latest
    container_name: rustmail-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP submission (dev)
      - "${MAILPIT_UI_PORT:-8025}:8025"     # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  pgdata:
  redisdata:
